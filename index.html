<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nineties Filmi Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: playful, nostalgic, a Sunday-night Chitrahaar countdown
   IDEA: a 90s cassette deck with a film-poster sleeve
   PICTURE: a big cassette whose reels spin while the snippet plays
   COLOUR and TYPE: magenta dominant, marigold support, teal accent; Yatra One + Poppins
   LAYOUT: one column: title, cassette, question, answer chips, score strip */
:root{color-scheme:light dark;
--bg:light-dark(#fff4e2,#1a0b16);--ink:light-dark(#2a0f22,#fdeee0);--muted:light-dark(#7a5068,#c9a7b8);
--mag:#c2185b;--mag2:light-dark(#9c0f47,#ff4f93);--gold:#ffb300;--teal:#00897b;--card:light-dark(#ffffff,#2a1424);--line:light-dark(#f0d6c0,#4a2a3c)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Poppins,system-ui,sans-serif;overflow-x:clip}
header{background:var(--mag);color:#fff;padding:18px max(5vw,16px) 22px;text-align:center;border-bottom:6px solid var(--gold)}
h1{font:400 clamp(32px,6vw,52px)/1.05 "Yatra One",serif;margin:0;text-wrap:balance}
header p{margin:6px 0 0;opacity:.9}
main{max-width:720px;margin:0 auto;padding:20px max(4vw,16px) 48px}
.deck{background:linear-gradient(160deg,#3a1630,#1c0a17);border-radius:22px;padding:22px;box-shadow:0 14px 30px #0004;color:#fff}
.tape{background:linear-gradient(#ffcc4d,#ff9f00);border-radius:14px;padding:16px;position:relative;box-shadow:inset 0 -6px 0 #0002}
.label{background:#fff8ea;color:#2a0f22;border-radius:8px;padding:6px 12px;font:600 14px Poppins;display:flex;justify-content:space-between;gap:8px}
.window{margin:14px auto 4px;background:#2a0f22;border-radius:40px;height:96px;display:flex;align-items:center;justify-content:space-around;max-width:420px}
.reel{width:72px;height:72px;border-radius:50%;background:radial-gradient(circle,#fff 0 14%,#2a0f22 15% 30%,#6b3a55 31% 100%);position:relative}
.reel::before,.reel::after{content:"";position:absolute;inset:44% 8%;background:#fff;border-radius:3px}
.reel::after{transform:rotate(60deg)}
.spin .reel{animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin .reel{animation:none}}
.bar{height:6px;background:#0003;border-radius:3px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--mag)}
.controls{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
button{font:600 16px Poppins;min-height:44px;border-radius:999px;border:0;padding:0 20px;cursor:pointer}
button:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.play{background:var(--gold);color:#2a0f22;min-width:150px}
.ghost{background:#ffffff1f;color:#fff}
button:disabled{opacity:.45;cursor:default}
.q{margin:26px 0 12px;font:400 clamp(22px,4vw,30px)/1.15 "Yatra One",serif;text-align:center;text-wrap:balance}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:14px;min-height:56px;padding:10px 14px;text-align:left;font-weight:600}
.opt:hover:not(:disabled){border-color:var(--mag2)}
.opt.right{background:var(--teal);border-color:var(--teal);color:#fff;opacity:1}
.opt.wrong{background:var(--mag);border-color:var(--mag);color:#fff;opacity:1}
.reveal{margin-top:16px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;display:flex;gap:14px;align-items:center}
.reveal img{width:84px;height:84px;border-radius:10px;flex:none;background:var(--line)}
.reveal b{display:block;font-size:18px}
.reveal dl{margin:4px 0 0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:14px}
.reveal dt{color:var(--muted)}.reveal dd{margin:0}
.strip{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:22px;color:var(--muted);font-size:14px}
.strip strong{color:var(--ink);font-size:18px}
.setup{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:20px}
label{font-size:14px;color:var(--muted);display:grid;gap:4px}
select{font:16px Poppins;min-height:44px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);padding:0 10px}
.start{background:var(--mag);color:#fff;width:100%;margin-top:16px;min-height:52px;font-size:18px}
.msg{text-align:center;color:var(--muted);min-height:1.5em;margin-top:10px;font-size:14px}
.end{text-align:center}.end .big{font:400 clamp(44px,10vw,72px)/1 "Yatra One",serif;color:var(--mag2)}
.hide{display:none}
.signup{max-width:420px;margin:24px auto 0;display:grid;gap:14px}
.signup h2,.lb h2{font:400 clamp(24px,4vw,30px)/1.15 "Yatra One",serif;margin:0;text-align:center}
.signup p{margin:0;text-align:center;color:var(--muted)}
input[type=text]{font:16px Poppins;min-height:48px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);padding:0 14px;width:100%}
input[type=text]:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.err{color:var(--mag2);font-size:14px;min-height:1.2em;margin:0;text-align:center}
.who{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:20px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 14px}
.who b{font-size:17px}
.record{margin:8px 0 0;padding:10px 14px;border-radius:14px;background:color-mix(in srgb,var(--gold) 22%,var(--card));border:0;font-size:15px}
.record b{color:light-dark(#1b7a3d,#5fd38a)}
.link{background:none;color:var(--mag2);padding:0 6px;min-height:44px;text-decoration:underline;font-weight:600}
.lb{margin-top:24px;text-align:left}
.lb table{width:100%;border-collapse:collapse;margin-top:12px;background:var(--card);border-radius:14px;overflow:hidden;border:2px solid var(--line)}
.lb th,.lb td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line)}
.lb th{font-size:13px;color:var(--muted);font-weight:600}
.lb td.n,.lb th.n{text-align:right;font-variant-numeric:tabular-nums}.lb td.n{white-space:nowrap}
.lb tr.me td{background:color-mix(in srgb,var(--gold) 28%,transparent);font-weight:700}
.lb .note{font-size:13px;color:var(--muted);margin-top:8px;text-align:center}
.fb-btn{position:fixed;right:14px;bottom:14px;z-index:20;background:var(--ink);color:var(--bg);min-height:42px;padding:0 16px;font-size:14px;box-shadow:0 6px 16px #0003}
.modal{position:fixed;inset:0;z-index:30;background:#0009;display:flex;align-items:center;justify-content:center;padding:16px}
.modal.hide{display:none}
.modal-card{background:var(--bg);color:var(--ink);border-radius:18px;padding:20px;width:100%;max-width:460px;display:grid;gap:12px;box-shadow:0 20px 40px #0005;max-height:calc(100dvh - 32px);overflow:auto}
.modal-card h2{font:400 26px/1.15 "Yatra One",serif;margin:0}
.fb-song{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;display:grid;gap:6px}
.fb-song p{margin:0}.fb-song .muted{color:var(--muted)}
.chk{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:15px;font-weight:600}
.chk input{width:20px;height:20px;accent-color:var(--mag)}
textarea{font:16px/1.45 Poppins;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);padding:10px 12px;width:100%;resize:vertical;min-height:110px}
textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end}
.modal-actions .start{width:auto;margin:0;min-height:46px;padding:0 24px;font-size:16px}
.btn2{background:transparent;color:var(--ink);border:2px solid var(--line)}
.ok{color:light-dark(#1b7a3d,#5fd38a);font-size:14px;min-height:1.2em;margin:0}
main{padding-bottom:80px}
footer{text-align:center;color:var(--muted);font-size:13px;padding:0 16px 30px}
@media(max-width:600px){
  header{padding:12px 16px 14px;border-bottom-width:4px}header p{font-size:14px;margin-top:2px}
  main{padding:14px 14px 40px}
  .deck{padding:12px;border-radius:18px}.tape{padding:10px;border-radius:12px}
  .window{height:60px;margin:10px auto 2px}.reel{width:46px;height:46px}
  .controls{gap:8px;margin-top:12px;flex-wrap:nowrap}.controls button{padding:0 14px}.play{min-width:0;flex:1}
  #nextBtn{flex:1}
  .q{margin:14px 0 10px}
  .opts{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.opt{min-height:54px;padding:8px 10px;font-size:15px;line-height:1.25}
  .setup{grid-template-columns:minmax(0,1fr)}
  .reveal{padding:10px;gap:10px}.reveal img{width:64px;height:64px}
  .lb th,.lb td{padding:8px 5px;font-size:13px}.lb .long{display:none}
}
</style>
</head>
<body>
<header>
  <h1>Nineties Filmi Quiz</h1>
  <p>Hear a few seconds. Name the film, the singer or the star.</p>
</header>
<main>
  <section class="deck hide" id="deck" aria-label="Player">
    <div class="tape" id="tape">
      <div class="label"><span id="sideA">Side A · 1990–1999</span><span id="roundLbl">Ready</span></div>
      <div class="window"><div class="reel"></div><div class="reel"></div></div>
      <div class="bar"><i id="prog"></i></div>
    </div>
    <div class="controls">
      <button class="play" id="playBtn" disabled>▶ Play clip</button>
      <button class="ghost" id="moreBtn" disabled>+5 sec</button>
      <button class="ghost" id="skipBtn" disabled>Skip</button>
    </div>
    <p class="msg" id="msg" style="color:#e8c9d8"></p>
  </section>

  <section id="signupView" class="hide">
    <form class="signup" id="signupForm" novalidate>
      <h2>Who's playing?</h2>
      <p>Sign up to get on the leaderboard.</p>
      <label>First name<input type="text" id="firstName" autocomplete="given-name" maxlength="30" required></label>
      <label>City<input type="text" id="city" autocomplete="address-level2" maxlength="40" required></label>
      <p class="err" id="signupErr" role="alert"></p>
      <button class="start" type="submit">Let's play</button>
    </form>
  </section>

  <section id="setupView" class="hide">
    <div class="who"><span>Playing as <b id="whoName"></b> · <span id="whoCity"></span></span><button class="link" id="switchBtn" type="button">Switch player</button></div>
    <p class="record" id="best" aria-live="polite"></p>
    <div class="setup">
      <label>Era
        <select id="era">
          <option value="90s">1990s</option>
          <option value="00s">2000s</option>
          <option value="all">Both</option>
        </select>
      </label>
      <label>Guess the
        <select id="mode">
          <option value="mix">Mix it up</option>
          <option value="film">Soundtrack (film)</option>
          <option value="singer">Singer</option>
          <option value="actor">Actor / actress on screen</option>
        </select>
      </label>
      <label>Clip length
        <select id="len">
          <option value="4">4 sec (hard)</option>
          <option value="8" selected>8 sec</option>
          <option value="15">15 sec (easy)</option>
        </select>
      </label>
      <label>Songs
        <select id="rounds"><option>5</option><option selected>10</option><option>20</option></select>
      </label>
    </div>
    <p class="err" id="setupMsg" role="alert"></p>
    <button class="start" id="startBtn" aria-label="Play">▶ Play</button>
  </section>

  <section id="gameView" class="hide">
    <h2 class="q" id="question">…</h2>
    <div class="opts" id="opts"></div>
    <div class="reveal hide" id="reveal"></div>
    <div class="controls"><button class="start hide" id="nextBtn">Next song →</button></div>
    <div class="strip"><span>Correct <strong id="score">0</strong></span><span>Streak <strong id="streak">0</strong></span><span>Song <strong id="round">0</strong></span></div>
  </section>

  <section id="endView" class="hide end">
    <p class="q">That's the end of the tape</p>
    <div class="big" id="final">0</div>
    <p id="finalNote" class="msg"></p>
    <div class="lb">
      <h2>Leaderboard</h2>
      <table><thead><tr><th class="n">#</th><th>Name</th><th>City</th><th class="n"><span class="long">Songs </span>played</th><th class="n">Correct</th><th class="n">Best streak</th></tr></thead><tbody id="lbBody"></tbody></table>
      <p class="note" id="lbNote"></p>
    </div>
    <button class="start" id="againBtn">Play again</button>
  </section>
</main>
<button class="fb-btn" id="fbBtn" type="button" aria-haspopup="dialog">Feedback</button>
<div class="modal hide" id="fbModal" role="dialog" aria-modal="true" aria-labelledby="fbTitle">
  <form class="modal-card" id="fbForm" novalidate>
    <h2 id="fbTitle">Send feedback</h2>
    <div class="fb-song hide" id="fbSong">
      <label class="chk"><input type="checkbox" id="fbAbout" checked> This is about the current song</label>
      <p id="fbQ"></p>
      <p class="muted" id="fbA"></p>
    </div>
    <label>Your feedback<textarea id="fbText" maxlength="2000" rows="5" placeholder="A wrong answer, a clip that didn't play, an idea…"></textarea></label>
    <p class="err" id="fbErr" role="alert"></p><p class="ok" id="fbOk" role="status"></p>
    <div class="modal-actions"><button class="btn2" type="button" id="fbCancel">Cancel</button><button class="start" type="submit" id="fbSend">Send</button></div>
  </form>
</div>

function jsonp(url){
  return new Promise((res,rej)=>{
    const cb="itcb"+(++jsonpN),s=document.createElement("script");
    const t=setTimeout(()=>{cleanup();rej(new Error("timeout"))},8000);
    function cleanup(){clearTimeout(t);delete window[cb];s.remove()}
    window[cb]=d=>{cleanup();res(d)};
    s.onerror=()=>{cleanup();rej(new Error("network"))};
    s.src=url+"&callback="+cb;document.head.appendChild(s);
  });
}
async function loadPreviews(songs){
  for(const country of ["in","us"]){
    const ids=songs.filter(s=>s.country===country&&!(s.id in cache)).map(s=>s.id);
    for(let i=0;i<ids.length;i+=50){
      try{
        const d=await jsonp("https://itunes.apple.com/lookup?country="+country+"&id="+ids.slice(i,i+50).join(","));
        for(const r of d.results||[])if(r.previewUrl)cache[r.trackId]={url:r.previewUrl,art:(r.artworkUrl100||"").replace("100x100","200x200")};
      }catch(e){}
    }
  }
}
async function findTrack(song){
  const tw=norm(song.title).split(" ").slice(0,3).join(" "),fw=norm(song.film);
  const sc=x=>{const cn=norm(x.collectionName||""),tn=norm(x.trackName);let s=0;
    if(cn===fw||cn.startsWith(fw+" "))s+=4;if(tn.includes("from "+fw))s+=4;
    if(/original motion picture|soundtrack/i.test(x.collectionName))s+=2;if(/dialogue/i.test(x.collectionName))s-=1;
    if(/ - (single|ep)$/i.test(x.collectionName)&&!tn.includes("from "+fw))s-=4;return s};
  for(const country of ["in","us"]){
    let d;try{d=await jsonp("https://itunes.apple.com/search?media=music&entity=song&limit=25&country="+country+"&term="+encodeURIComponent(song.query||song.title+" "+song.film))}catch(e){continue}
    const ok=(d.results||[]).filter(x=>x.previewUrl&&norm(x.trackName).includes(tw)&&!BADT.test(x.trackName)&&!BADC.test(x.collectionName||"")&&sc(x)>=4).sort((p,q)=>sc(q)-sc(p));
    if(ok.length){const r=ok[0];cache[r.trackId]={url:r.previewUrl,art:(r.artworkUrl100||"").replace("100x100","200x200")};song.id=r.trackId;song.country=country;
      if(!song.singers||!song.singers.length)song.singers=singersFrom(r.artistName);return true}
  }
  return false;
}
async function prepare(song){
  if(song.id&&!cache[song.id])await loadPreviews([song]);
  if(song.id&&cache[song.id])return true;
  return findTrack(song);
}

const eraSongs=e=>SONGS.filter(s=>(ERAS[e]||ERAS["90s"]).test(s.year));
function buildQuestion(song,mode){
  const P=state&&state.pool||SONGS,fam=song.year>=2000?FAMOUS00:FAMOUS;
  let kind=mode==="mix"?pick(["film","singer","actor"]):mode;
  if(kind==="singer"&&!(song.singers&&song.singers.length))kind="film";
  let answer,pool,prompt;
  if(kind==="film"){answer=song.film;pool=[...new Set(P.map(s=>s.film))].filter(f=>f!==song.film);prompt="Which film is this song from?"}
  if(kind==="singer"){answer=pick(song.singers);pool=[...new Set([...fam,...P.flatMap(s=>s.singers||[])])].filter(x=>!song.singers.includes(x));prompt="Who sings on this track?"}
  if(kind==="actor"){answer=pick(song.actors);pool=[...new Set(P.flatMap(s=>s.actors))].filter(x=>!song.actors.includes(x));prompt="Who is on screen in this song?"}
  return {kind,answer,prompt,options:shuffle([answer,...shuffle(pool).slice(0,3)])};
}

async function start(){
  $("startBtn").disabled=true;$("startBtn").textContent="Loading the tape…";
  const era=$("era").value,pool=eraSongs(era),total=+$("rounds").value,queue=shuffle(pool);store("filmiEra",era);$("sideA").textContent=ERAS[era].label;
  const [,srv]=await Promise.all([loadPreviews(queue.slice(-(total+20)).filter(s=>s.id)),serverStreak()]);
  const all=players(),pl=all[me];
  if(srv){pl.streak=srv.current_streak;pl.bestStreak=Math.max(pl.bestStreak||0,srv.best_streak);store("filmiPlayers",all)}
  state={pool,mode:$("mode").value,len:+$("len").value,total,ready:[],resolved:false,round:0,correct:0,
    carried:pl.streak||0,run:0,lead:0,leadAlive:true,maxRun:0};
  $("score").textContent=0;$("streak").textContent=state.carried;
  const st=state;
  (async()=>{while(st.ready.length<total&&queue.length&&state===st){const s=queue.pop();if(await prepare(s))st.ready.push(s)}st.resolved=true})();
  while(!st.ready.length&&!st.resolved)await sleep(150);
  $("startBtn").disabled=false;$("startBtn").textContent="▶ Play";
  if(!st.ready.length){$("setupMsg").textContent="Couldn't reach Apple Music. Check your internet connection and try again.";return}
  $("setupMsg").textContent="";
  show("gameView");next();
}
async function next(){
  if(state.busy)return;state.busy=true;state.song=null;state.q=null;
  stopClip();
  $("reveal").classList.add("hide");$("nextBtn").classList.add("hide");$("opts").innerHTML="";
  if(state.ready.length<=state.round&&!state.resolved){setButtons(false);$("question").textContent="Finding the next tape…";while(state.ready.length<=state.round&&!state.resolved)await sleep(150)}
  if(state.resolved)state.total=Math.min(state.total,state.ready.length);
  state.busy=false;
  if(state.round>=state.total){return finish()}
  msg("");
  const song=state.ready[state.round],prev=cache[song.id];
  state.round++;state.song=song;state.prev=prev;state.answered=false;state.extra=0;state.userAnswer=null;
  state.q=buildQuestion(song,state.mode);
  $("round").textContent=state.round+" / "+state.total;$("roundLbl").textContent="Song "+state.round;
  $("question").textContent=state.q.prompt;
  $("opts").innerHTML=state.q.options.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join("");
  audio.src=prev.url;state.offset=null;$("playBtn").textContent="▶ Play clip";
  setButtons(true);playClip();
}
function setButtons(on){for(const id of ["playBtn","moreBtn","skipBtn"])$(id).disabled=!on}

function playClip(){
  const go=()=>{
    if(state.offset==null){const d=audio.duration||30;state.offset=Math.max(0,Math.random()*Math.max(1,d-state.len-8)+3)}
    audio.currentTime=state.offset;stopAt=state.offset+state.len+state.extra;
    audio.play().then(()=>{$("tape").classList.add("spin");$("playBtn").textContent="↻ Replay clip";tick()}).catch(()=>msg("Tap Play to hear the clip."));
  };
  if(audio.readyState>=1)go();else audio.addEventListener("loadedmetadata",go,{once:true});
}
function tick(){
  clearInterval(timer);

  },100);
}

function answer(i){

}
const online=()=>!!(LEADERBOARD.url&&LEADERBOARD.key);
function sbHeaders(){const hd={apikey:LEADERBOARD.key,"Content-Type":"application/json"};if(LEADERBOARD.key.startsWith("eyJ"))hd.Authorization="Bearer "+LEADERBOARD.key;return hd}
async function sb(path,body){
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),10000);
  try{const r=await fetch(LEADERBOARD.url.replace(/\/$/,"")+"/rest/v1/"+path,{method:body?"POST":"GET",headers:sbHeaders(),body:body?JSON.stringify(body):undefined,signal:ctl.signal});

}

    drawBoard(rows.map(r=>({name:r.name,city:r.city,played:r.songs_played,correct:r.songs_correct,bestStreak:r.best_streak})),me,"Top 20 players everywhere, totals across all their games.");
  }catch(e){
    drawBoard(localRows(),me,"Couldn't reach the online leaderboard, so this shows players in this browser only. This game's score wasn't saved online.");
  }
}
function finalNote(){
  const p=players()[me],s=p.streak||0,b=p.bestStreak||0;
  $("finalNote").textContent=`Current streak: ${s} in a row`+(state.newBest&&b>0?" · new best streak!":` · best streak: ${b}`);
}
function finish(){
  stopClip();show("endView");
  const all=players(),p=all[me],played=Math.max(0,state.round),prevBest=p.bestStreak||0;
  const cur=state.leadAlive&&state.lead===played?state.carried+played:state.run;
  p.played=(p.played||0)+played;p.correct=(p.correct||0)+state.correct;p.games=(p.games||0)+1;
  p.streak=cur;p.bestStreak=Math.max(prevBest,state.carried+state.lead,state.maxRun,cur);state.newBest=p.bestStreak>prevBest;
  store("filmiPlayers",all);showWho();
  $("final").textContent=`${state.correct}/${played}`;finalNote();
  renderBoard({played,correct:state.correct,lead:state.lead,tail:state.run,maxRun:state.maxRun});
  $("roundLbl").textContent="Ready";
}

const SCREENS={signupView:"signup",setupView:"setup",gameView:"game",endView:"results"};
let fbOpener=null;
function songContext(){return view==="gameView"&&state&&state.song&&state.q?state:null}
function openFeedback(){
  fbOpener=document.activeElement;const st=songContext();
  $("fbSong").classList.toggle("hide",!st);
  if(st){$("fbAbout").checked=true;$("fbQ").textContent=`Song ${st.round}: ${st.q.prompt}`;
    $("fbA").textContent=st.userAnswer?`Your answer: ${st.userAnswer}`:"Not answered yet";}
  $("fbErr").textContent="";$("fbOk").textContent="";$("fbSend").disabled=false;
  $("fbModal").classList.remove("hide");$("fbText").focus();
}
function closeFeedback(){$("fbModal").classList.add("hide");if(fbOpener&&fbOpener.focus)fbOpener.focus()}
$("fbBtn").addEventListener("click",openFeedback);
$("fbCancel").addEventListener("click",closeFeedback);
$("fbModal").addEventListener("click",e=>{if(e.target===$("fbModal"))closeFeedback()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("fbModal").classList.contains("hide"))closeFeedback()});
$("fbForm").addEventListener("submit",async e=>{e.preventDefault();
  const text=$("fbText").value.trim();$("fbOk").textContent="";
  if(!text){$("fbErr").textContent="Please write a little feedback first.";return}
  if(!online()){$("fbErr").textContent="Feedback can't be sent right now.";return}
  const p=(me&&players()[me])||{},st=$("fbAbout").checked?songContext():null;
  $("fbErr").textContent="";$("fbSend").disabled=true;$("fbSend").textContent="Sending…";
  try{
    await sb("rpc/submit_feedback",{p_screen:SCREENS[view]||"setup",p_message:text,p_player_name:p.name||null,p_player_city:p.city||null,
      p_song_title:st?st.song.title:null,p_film:st?st.song.film:null,p_track_id:st?st.song.id||null:null,p_clip_url:st&&st.prev?st.prev.url:null,
      p_question:st?st.q.prompt:null,p_options:st?st.q.options:null,p_user_answer:st?st.userAnswer:null,p_correct_answer:st?st.q.answer:null});
    $("fbText").value="";$("fbOk").textContent="Thanks! Your feedback was sent.";setTimeout(closeFeedback,1400);
  }catch(err){$("fbErr").textContent="Sorry, your feedback couldn't be sent. Please try again in a moment."}
  finally{$("fbSend").disabled=false;$("fbSend").textContent="Send"}
});
$("signupForm").addEventListener("submit",e=>{e.preventDefault();
  const n=$("firstName").value.trim(),c=$("city").value.trim();
  if(!n||!c){$("signupErr").textContent="Please enter your first name and city.";return}
  $("signupErr").textContent="";const all=players(),k=keyOf(n,c);
  if(!all[k])all[k]={name:n,city:c,played:0,correct:0,games:0,streak:0,bestStreak:0};
  store("filmiPlayers",all);me=k;store("filmiCurrent",k);showWho();show("setupView")});
$("switchBtn").addEventListener("click",()=>{$("firstName").value="";$("city").value="";show("signupView");$("firstName").focus()});
{const e=store("filmiEra");if(e&&ERAS[e])$("era").value=e;$("sideA").textContent=ERAS[$("era").value].label}
signIn();
$("startBtn").addEventListener("click",start);
$("againBtn").addEventListener("click",()=>{show("setupView")});
$("nextBtn").addEventListener("click",next);
$("playBtn").addEventListener("click",()=>{if(!state.answered)stopAt=state.offset+state.len+state.extra;playClip()});
$("moreBtn").addEventListener("click",()=>{if(state.answered)return;state.extra+=5;msg("Playing 5 more seconds");playClip()});
$("skipBtn").addEventListener("click",()=>{if(!state.answered&&!state.busy){state.answered=true;state.userAnswer="Skipped";tally(false);logAnswer("skipped")}next()});
$("opts").addEventListener("click",e=>{const b=e.target.closest(".opt");if(b)answer(b.dataset.i)});
audio.addEventListener("ended",stopClip);
audio.addEventListener("error",()=>msg("This clip didn't load. Press Skip for the next song."));
}
</script>
</body>
